name: wassa-${DEPLOY_ENV:-production}
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: wassa
      POSTGRES_USER: wassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wassa -d wassa"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1
  web:
    image: ${WEB_IMAGE:-wassa-web:local}
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
    environment: &runtime
      APP_ENV: ${DEPLOY_ENV:-production}
      BETTER_AUTH_URL: ${APP_URL:?Set the HTTPS application URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a unique authentication secret}
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: wassa
      PGUSER: wassa
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_DESIGN_PREVIEW: "false"
      MEDIA_ROOT: /data/media
    expose: ["3000"]
    volumes:
      - media:/data/media
    mem_limit: 1536m
    cpus: 1
  migrate:
    image: ${TOOLS_IMAGE:-wassa-tools:local}
    build:
      context: .
      target: tools
    profiles: [tools]
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
    environment: *runtime
    command: [npm, run, db:migrate]
volumes:
  postgres:
  media:
