<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#006b3f" />
    <title>You’re offline | Wassa East Projects</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        background: #f5f6f7;
        color: #111;
        font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        width: min(420px, 100%);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.75rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #5c6761;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        min-width: 160px;
        padding: 12px 24px;
        border-radius: 14px;
        background: #006b3f;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #111;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/icon-192.png" alt="" width="72" height="72" />
      <h1>You’re offline</h1>
      <p>
        Check your internet connection. This page will try again
        automatically when you’re back online.
      </p>
      <a href="">Try again</a>
    </main>
    <script>addEventListener("online",function(){location.reload()});</script>
  </body>
</html>
