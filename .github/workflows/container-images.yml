name: Release to Coolify

# Builds use GitHub runners, never the shared Coolify production server.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release images to GitHub Container Registry
        type: boolean
        default: false
        required: true
      deploy:
        description: Deploy published images to Coolify (main only)
        type: boolean
        default: false

# Never interrupt a release while its two image references are being updated.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'coolify-production' || format('validation-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - name: Check deployment configuration
        if: ${{ github.event_name == 'push' || (inputs.publish && inputs.deploy) }}
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_RESOURCE_TYPE: ${{ vars.COOLIFY_RESOURCE_TYPE }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: node scripts/coolify-deploy.mjs --check

  acceptance:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: wassa_test
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U acceptance -d wassa_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://acceptance:disposable-ci-password@127.0.0.1:55432/wassa_test
      BETTER_AUTH_SECRET: disposable-ci-auth-secret-not-used-outside-tests-2026
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:migrations
      - run: npm run test:acceptance
      - name: Retain failed acceptance evidence (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container-rollout:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      RELEASE_ID: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p .local
      - run: docker build --target web --build-arg RELEASE_ID="$RELEASE_ID" -t wassa-ci-web:check .
      - run: docker build --target tools --build-arg RELEASE_ID="$RELEASE_ID" -t wassa-ci-tools:check .
      - run: node scripts/check-container-release.mjs

  images:
    needs: [checks, acceptance, container-rollout]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set release image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${TARGET}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: RELEASE_ID=sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.publish == true }}
          load: ${{ github.event_name != 'push' && inputs.publish != true }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check non-root media access
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker run --rm --entrypoint node "$IMAGE" -e
          "const fs=require('node:fs');if(process.getuid()!==1001)process.exit(1);fs.writeFileSync('/data/media/.permission-check','ok');fs.unlinkSync('/data/media/.permission-check');console.log('Non-root media write passed')"
      - name: Record published digest for Coolify
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          printf '%s\n' "${TARGET} image: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: images
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.publish && inputs.deploy)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Update release images and redeploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_RESOURCE_TYPE: ${{ vars.COOLIFY_RESOURCE_TYPE }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/coolify-deploy.mjs
