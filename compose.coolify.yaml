# Production: paste into Coolify Docker Compose Empty, or select this file in a
# Git-based Compose application. Images must be built outside the shared server.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: wassa
      POSTGRES_USER: wassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wassa -d wassa"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1
  migrate:
    image: ${TOOLS_IMAGE:?}
    restart: "no"
    init: true
    # Coolify removes this extension before passing the definition to Compose.
    exclude_from_hc: true
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
    environment: &runtime
      NODE_ENV: production
      APP_ENV: production
      BETTER_AUTH_URL: ${APP_URL:?}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: wassa
      PGUSER: wassa
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_DESIGN_PREVIEW: "false"
      MEDIA_ROOT: /data/media
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      GOOGLE_PLAY_URL: ${GOOGLE_PLAY_URL:-}
      APP_STORE_URL: ${APP_STORE_URL:-}
      ENABLE_BROWSER_PUSH: ${ENABLE_BROWSER_PUSH:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
    command: [npm, run, db:migrate]
    mem_limit: 512m
    cpus: 0.5
  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    init: true
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *runtime
    # Coolify Domains targets web at https://YOUR_HOST:3000.
    # APP_URL above is the public origin: https://YOUR_HOST (without :3000).
    expose: ["3000"]
    volumes:
      - media:/data/media
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1536m
    cpus: 1
  # Nightly encrypted off-site backup of the database and media (see
  # docs/BACKUPS.md). Idles harmlessly until the BACKUP_* settings exist.
  backup:
    image: ${TOOLS_IMAGE:?}
    restart: unless-stopped
    init: true
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ENV: production
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: wassa
      PGUSER: wassa
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MEDIA_ROOT: /data/media
      BACKUP_TIME: "02:00"
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_APPLICATION_KEY:-}
    command: [node, scripts/backup.mjs, schedule]
    volumes:
      - media:/data/media:ro
    mem_limit: 512m
    cpus: 0.5
  notifications:
    image: ${TOOLS_IMAGE:?}
    restart: unless-stopped
    init: true
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *runtime
    command: [node, --import, tsx, scripts/notification-worker.ts]
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/notification-worker.ts, --health]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
volumes:
  postgres:
  media:
